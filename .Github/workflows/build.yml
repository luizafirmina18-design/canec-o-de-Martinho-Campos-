name: Build PKG PS3
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build com PSL1GHT
        uses: docker://psl1ght/psl1ght
        with:
          args: make pkg
      - name: Baixar PKG
        uses: actions/upload-artifact@v4
        with:
          name: canecao-pkg
          path: "*.pkg"